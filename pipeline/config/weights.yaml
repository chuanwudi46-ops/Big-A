# 炒股工作台 · 12 维评分权重配置
# 修改本文件即可调整评分口径，无需改代码
version: "1.0"
updated: "2026-09-11"
window: 250                 # 分位归一化窗口（交易日）

weights:                    # 11 个正向维度，合计必须为 1.0
  momentum: 0.10            #  1 动量：5/20/60 日涨幅 + 相对沪深300 超额
  trend: 0.10               #  2 趋势结构：MA20/MA60 排列 + KDJ(9,3,3)
  volume_price: 0.08        #  3 量价健康：缩量调整 / 上涨放量 / 背离
  turnover: 0.08            #  4 换手率位置：250 日分位，**低分位加分**（=1−分位）
                            #    2026-09-16 修正：代码原为「高分位加分」，与注释/前端/回测三方都相反
  fund_flow: 0.10           #  5 主力资金流：主力净流入占比
  valuation: 0.10           #  6 估值位置：有 PE 时「PE 越低越好」；无 PE 时退化为
                            #    252 日价格分位代理 = 「价格越高越好」（方向相反，是刻意的）
  cycle: 0.08               #  7 周期位置：价格动量 + 涨价信号
  clearing: 0.06            #  8 行业出清度：静态表（人工维护）
  policy: 0.06              #  9 政策强度：反内卷/供给侧/稳增长关键词
  news: 0.12                # 10 新闻情绪：情绪分 × 时效衰减
  resonance: 0.12           # 11 板块共振：成分股涨跌一致性

penalty:                    # 12 筹码供给（负向罚分，0 ~ chip_supply_max）
  chip_supply_max: 20.0
  release_weight: 0.0       # 解禁吃满时的罚分 —— **2026-09-16 置 0（退出罚分）**
                            #    原因：四个独立口径的实测一致说明「解禁 ≠ 利空」，
                            #    且方向上**相反**。生产同款口径（未来 30 日解禁市值/板块总市值
                            #    逐日重建，再过同一个 chip_supply()）：
                            #      有解禁 − 无解禁          中期 +0.05pt
                            #      占比≥5%（吃满） − 无解禁  中期 +1.16pt
                            #      罚分 9-12 分 − 0 分       中期 +0.82pt（为正日期 53%）
                            #      解禁/成交额 >3 天 − 无解禁 中期 +0.44pt（交叉验证）
                            #    外加个股事件研究（1.7 万条）：解禁后 20 日平均 **+1.84%**。
                            #    → 照原样罚，等于**扣那些随后跑得更好的板块**。
                            #    **不做反向加分**：效应量很小、中段不单调（6-9 分段为负），
                            #    反向属过拟合。原始数据仍逐板块写在产物
                            #    `penalty_detail.release_ratio / release_mv_yi` 里作提示，
                            #    不丢信息。详见 docs/backtest_report_hist.md §5.7.1 / §6.2。
                            #    想恢复：把本值改回 12.0 即可（阈值语义见下）。
  reduction_weight: 4.0     # 减持吃满时的罚分（**保留**：减持公告历史不可得，
                            #    无法回测；但「内部人卖出」的理论依据比解禁强，且上限只有 4 分）
  release_threshold: 0.05   # 解禁市值/板块总市值 达到 5% 即吃满（release_weight=0 时不生效，
                            #    保留以便恢复；同口径检验用的就是这个阈值）
  reduction_threshold: 5    # 近期减持公告达 5 条即吃满
  horizon_days: 30          # 解禁压力回看窗口（自今日起未来 N 天）

blacklist:                  # 负面清单（可手动编辑；实际清单在 sector_meta.json）
  enabled: true             # 关掉此项则不做负面清单压制
  cap: 45.0                 # 命中后的分数上限
  tag: "回避"

grade:                      # 分级阈值
  strong: 75
  watch: 60
  neutral: 45
  weak: 30

macro:                      # 宏观分（股市上涨四要素）
  weights: { liquidity: 0.30, volume_price: 0.25, policy: 0.25, sentiment: 0.20 }
  sentiment_inverse: true   # 情绪项逆向映射（散户情绪极差 ≈ 反向指标）
  gate_attack: 70           # M >= 70 -> 进攻
  gate_neutral: 40          # 40 <= M < 70 -> 中性；M < 40 -> 防守

intraday:
  mark: true                # 盘中（北京时间 09:15–15:00）的产物标注 intraday: true

archive:
  # ---- 归档时机 ----
  #   on_close（默认）：只有 close 阶段写归档，盘中 score 只刷新发布数据
  #   always          ：每次 score 都写。⚠️ 整份快照约 200 KB/次，盘中每 30 分钟一跑
  #                     就是约 640 MB/年（on_close 约 58 MB/年），别开。
  # 之所以 on_close 够用：backtest.load_snapshots 按**日期**去重且「整份」优先于
  # summary，盘中那几份对 IC 零增量 —— 攒样本要的是**天数**，不是文件数。
  mode: on_close
  # 除整份归档外，额外写一份轻量「分数矩阵」快照（几十 KB）。
  # 为什么需要：整份归档体积大、容易都挤在同一天，backtest.load_snapshots 按日期
  # 去重后样本数恒为 1 →「样本不足」是结构性的，不是「攒几周就好」。
  # 这份 summary 让跨日样本真正积累，从而可以评估**线上真实发布分**（12 维全套）的 IC。
  summary: true
  # summary 里是否带 11 维因子值：
  #   true  ≈ 30 KB/日（约 7 MB/年）→ 可以逐因子算 IC，
  #          尤其能覆盖 backtest_hist.py 无法重建的 5 维（资金流/出清/政策/新闻/共振）
  #   false ≈ 7 KB/日（约 1.7 MB/年）→ 只能算 12 维总分的 IC
  summary_factors: true
