name: _probe-flow

# 一次性探针：在海外 runner（真正跑生产的那台机器）上实测主力资金流端点。
# 用完即删 —— 它不是生产流程的一部分（见 china-finance-data-from-overseas-runner 手册）。
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - name: Probe fund-flow endpoints
        run: python tools/_probe_remote.py
