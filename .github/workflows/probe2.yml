name: probe2

# 临时探针 v2：定位 push2 clist 502 的成因，寻找可用的替代端点。
# 验证完成后即删除。
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe push2 variants
        run: |
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0 Safari/537.36'
          REF='https://quote.eastmoney.com/'
          show () {
            echo "--- $1 ---"
            curl -s -w '\nHTTP=%{http_code}\n' --max-time 25 -A "$UA" -e "$REF" "$2" | head -c 400
            echo ""
          }
          FS='m:90+t:2+f:!50'
          F='f12,f14'
          show 'A1 clist + ut 带ut参数' "https://push2.eastmoney.com/api/qt/clist/get?pn=1&pz=5&po=1&np=1&ut=bd1d9ddb04089700cf9c27f6f7426281&fltt=2&invt=2&fid=f3&fs=$FS&fields=$F"
          show 'A2 clist 无ut (重复)' "https://push2.eastmoney.com/api/qt/clist/get?pn=1&pz=5&po=1&np=1&fltt=2&invt=2&fid=f3&fs=$FS&fields=$F"
          show 'A3 clist http明文' "http://push2.eastmoney.com/api/qt/clist/get?pn=1&pz=5&po=1&np=1&ut=bd1d9ddb04089700cf9c27f6f7426281&fltt=2&invt=2&fid=f3&fs=$FS&fields=$F"
          show 'B1 82.push2 clist' "https://82.push2.eastmoney.com/api/qt/clist/get?pn=1&pz=5&po=1&np=1&ut=bd1d9ddb04089700cf9c27f6f7426281&fltt=2&invt=2&fid=f3&fs=$FS&fields=$F"
          show 'B2 push2delay clist' "https://push2delay.eastmoney.com/api/qt/clist/get?pn=1&pz=5&po=1&np=1&ut=bd1d9ddb04089700cf9c27f6f7426281&fltt=2&invt=2&fid=f3&fs=$FS&fields=$F"
          show 'C1 push2 stock/get 单板块' "https://push2.eastmoney.com/api/qt/stock/get?secid=90.BK0475&fields=f43,f57,f58,f62,f184&ut=bd1d9ddb04089700cf9c27f6f7426281"
          show 'C2 push2 ulist.np' "https://push2.eastmoney.com/api/qt/ulist.np/get?secids=90.BK0475,90.BK1032&fields=f12,f14,f3,f62,f184&ut=bd1d9ddb04089700cf9c27f6f7426281"
          show 'D1 push2his clist路径' "https://push2his.eastmoney.com/api/qt/clist/get?pn=1&pz=5&po=1&np=1&ut=bd1d9ddb04089700cf9c27f6f7426281&fltt=2&invt=2&fid=f3&fs=$FS&fields=$F"
          echo "===== sina / 日历 ====="
          echo "--- E1 sina hq 正确Referer ---"
          curl -s -w '\nHTTP=%{http_code}\n' --max-time 20 -A "$UA" -e 'https://finance.sina.com.cn' 'https://hq.sinajs.cn/list=sh000001' | head -c 300
          echo ""
          echo "--- E2 sina 交易日历 ---"
          curl -s -w '\nHTTP=%{http_code}\n' --max-time 20 -A "$UA" -e 'https://finance.sina.com.cn' 'https://finance.sina.com.cn/realstock/company/klc_td_sh.txt' | head -c 200
          echo ""
          echo "--- E3 datacenter 板块资金流 ---"
          curl -s -w '\nHTTP=%{http_code}\n' --max-time 25 -A "$UA" -e "$REF" 'https://push2.eastmoney.com/api/qt/clist/get?fid=f62&po=1&pz=5&pn=1&np=1&fltt=2&invt=2&fs=m:90+t:2&fields=f12,f14,f62,f184' | head -c 300
          echo ""
