name: probe4

# 临时探针 v4：确认 push2delay 是否能提供板块日 K 线（关键问题），
# 并测出 push2his 的限流阈值。验证完成后即删除。
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe kline hosts
        run: |
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0 Safari/537.36'
          REF='https://quote.eastmoney.com/'
          F1='f1,f2,f3,f4,f5,f6'
          F2='f51,f52,f53,f54,f55,f56,f57,f58,f59,f60,f61'
          UT='ut=bd1d9ddb04089700cf9c27f6f7426281'
          show () {
            out=$(curl -s -w '\n@@%{http_code}' --max-time 25 -A "$UA" -e "$REF" "$2" || true)
            code=$(printf '%s' "$out" | tail -1 | sed 's/@@//')
            body=$(printf '%s' "$out" | sed -e 's/@@[0-9]*$//' | tr -d '\n' | cut -c1-120)
            printf '%-40s HTTP=%s  %s\n' "$1" "$code" "$body"
          }
          KL () { echo "https://$1/api/qt/stock/kline/get?secid=90.$2&$UT&fields1=$F1&fields2=$F2&klt=101&fqt=1&beg=20250303&end=20260915&lmt=600"; }

          echo "===== 1. push2delay 能否提供 K 线（关键） ====="
          show 'push2delay BK1201 电子' "$(KL push2delay.eastmoney.com BK1201)"
          show 'push2delay BK0437 煤炭' "$(KL push2delay.eastmoney.com BK0437)"
          show 'push2delay BK0475 银行Ⅱ' "$(KL push2delay.eastmoney.com BK0475)"

          echo "===== 2. push2delay 连续 12 次（测限流） ====="
          for c in BK1200 BK1202 BK1203 BK1204 BK1205 BK1206 BK1207 BK1208 BK1209 BK1210 BK1211 BK1212; do
            show "push2delay $c" "$(KL push2delay.eastmoney.com $c)"
          done

          echo "===== 3. push2his 连续 10 次（测限流阈值） ====="
          for c in BK1200 BK1202 BK1203 BK1204 BK1205 BK1206 BK1207 BK1208 BK1209 BK1210; do
            show "push2his $c" "$(KL push2his.eastmoney.com $c)"
          done

          echo "===== 4. 其他候选域名 ====="
          show '82.push2his BK1213' "$(KL 82.push2his.eastmoney.com BK1213)"
          show 'push2his-delay BK1213' "$(KL push2his-delay.eastmoney.com BK1213)"
          show 'push2 BK1213' "$(KL push2.eastmoney.com BK1213)"
          show 'push2his 北京时间域 BK1214' "$(KL push2his.eastmoney.com BK1214)"
