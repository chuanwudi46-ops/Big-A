name: daily-score

on:
  schedule:
    # GitHub Actions 的 cron 用的是 **UTC**，北京时间 = UTC + 8。
    # 分钟一律取 :05 / :35 —— GitHub 的定时任务在整点前后最拥堵、延迟最大，
    # 错开能明显降低「到点没跑、晚了十几分钟」的概率。
    #
    # 09:10 预热一次即可：K 线走 Actions Cache 跨运行复用，盘中各次 score
    # 直接吃缓存，不必每次重抓（重抓 120 板块会撞对端限流）。
    #
    # :45 / :25 这两档是**为使用者的操作时点专门加的**：准备 09:50 / 13:30 动手，
    # 所以数据必须在那之前落定。注意 GitHub 的 cron 有 5~30 分钟延迟，
    # 单靠一档不能「保证」，故在这两个时点前后各留了一档（:35 + :45、:05 + :25）。
    - cron: "10 1 * * 1-5"    # 09:10 BJT 盘前预热
    - cron: "35 1 * * 1-5"    # 09:35 开盘后首次评分
    - cron: "45 1 * * 1-5"    # 09:45 → 保 09:50 动手时数据是新的
    - cron: "5 2 * * 1-5"     # 10:05
    - cron: "35 2 * * 1-5"    # 10:35
    - cron: "5 3 * * 1-5"     # 11:05
    - cron: "30 3 * * 1-5"    # 11:30 上午收盘
    - cron: "5 5 * * 1-5"     # 13:05 下午开盘
    - cron: "25 5 * * 1-5"    # 13:25 → 保 13:30 动手时数据是新的
    - cron: "35 5 * * 1-5"    # 13:35
    - cron: "5 6 * * 1-5"     # 14:05
    - cron: "35 6 * * 1-5"    # 14:35
    - cron: "5 7 * * 1-5"     # 15:05 收盘价已定
    - cron: "35 7 * * 1-5"    # 15:35 收盘复核 + 当天唯一一份归档
  workflow_dispatch:
    inputs:
      stage:
        description: "warmup | score | close"
        required: true
        default: "score"
        type: choice
        options: [warmup, score, close]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily-score
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r pipeline/requirements.txt

      # K 线增量缓存跨运行持久化。86 个板块 × 560 天 K 线约 3MB，
      # parquet 每日整体重写，提交进 git 会让仓库持续膨胀（年增约 1GB），
      # 故改用 Actions Cache。key 唯一 + restore-keys 前缀：每次取最近的，
      # 命中后 warmup 只需补当日增量，避免每天重下全量被限流。
      - name: Restore kline cache
        uses: actions/cache@v4
        with:
          path: web/data/cache
          key: kline-${{ github.run_id }}
          restore-keys: |
            kline-

      - name: Resolve stage
        id: s
        # 用 case 而不是 if/elif：cron 会随需求增删，**默认落到 score**，
        # 只有「盘前预热」和「收盘归档」两条需要显式列出。
        run: |
          if [ -n "${{ inputs.stage }}" ]; then
            st="${{ inputs.stage }}"
          else
            case "${{ github.event.schedule }}" in
              "10 1 * * 1-5") st=warmup ;;
              "35 7 * * 1-5") st=close  ;;
              *)              st=score  ;;
            esac
          fi
          echo "stage=$st" >> "$GITHUB_OUTPUT"
          echo "resolved stage: $st"

      - name: Run pipeline
        env:
          TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
        run: python pipeline/main.py --stage ${{ steps.s.outputs.stage }}

      - name: Commit data artifacts
        run: |
          git config user.name  "workbench-bot"
          git config user.email "bot@users.noreply.github.com"
          # 同时提交 config：sector_meta.json 首次构建自动生成后需固化，
          # weights.yaml / keywords_seed.json 的手动调整也应留痕
          git add -A web/data pipeline/config
          if git diff --cached --quiet; then
            echo "no data change"
          else
            # 提交信息用**北京时间**（runner 默认 UTC，看 log 容易把 15:43 的收盘
            # 提交误读成早上 07:43 —— 和产物时间戳是同一个坑）
            git commit -m "data: ${{ steps.s.outputs.stage }} $(TZ=Asia/Shanghai date +%FT%T)"
            git push
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web

  deploy:
    needs: run
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
