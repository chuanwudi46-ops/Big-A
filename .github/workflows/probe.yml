name: probe

# 临时探针：验证 GitHub 海外 runner 能否访问国内财经数据源。
# 用途仅限架构决策，验证完成后即删除。
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe endpoints
        run: |
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0 Safari/537.36'
          REF='https://quote.eastmoney.com/'
          probe () {
            printf '%-52s ' "$2"
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 -A "$UA" -e "$REF" "$1" || echo ERR)
            echo "HTTP=$code"
          }
          echo "===== runner egress IP ====="
          curl -s --max-time 15 https://api.ipify.org || true
          echo ""
          curl -s --max-time 15 https://ipinfo.io/json || true
          echo ""
          echo "===== eastmoney ====="
          probe 'https://push2.eastmoney.com/api/qt/clist/get?pn=1&pz=5&po=1&np=1&fltt=2&invt=2&fid=f3&fs=m:90+t:2+f:!50&fields=f12,f14' 'push2 clist'
          probe 'https://push2his.eastmoney.com/api/qt/stock/kline/get?secid=90.BK0475&fields1=f1,f2,f3&fields2=f51,f52,f53,f54,f55,f56,f57,f58,f59,f60,f61&klt=101&fqt=1&beg=20260101&end=20500101&lmt=10' 'push2his kline'
          probe 'https://np-listapi.eastmoney.com/comm/web/getFastNewsList?client=web&biz=web_724&fastColumn=102&sortEnd=&pageSize=20&req_trace=1' 'np-listapi news'
          probe 'https://quote.eastmoney.com/' 'quote home'
          probe 'https://datacenter-web.eastmoney.com/api/data/v1/get?reportName=RPT_LIFT_STAGE&pageSize=5&pageNumber=1' 'datacenter-web'
          echo "===== alternates ====="
          probe 'https://hq.sinajs.cn/list=sh000001' 'sina hq'
          probe 'https://qt.gtimg.cn/q=sh000001' 'tencent qt'
          probe 'https://web.ifzq.gtimg.cn/appstock/app/kline/kline?param=sh000001,day,,,10' 'tencent kline'
          probe 'https://push2.eastmoney.com' 'push2 root'
