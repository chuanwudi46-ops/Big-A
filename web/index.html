<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<meta name="theme-color" content="#0e1116" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="板块评分" />
<title>板块评分工作台</title>
<link rel="manifest" href="manifest.json" />
<link rel="apple-touch-icon" href="icon.svg" />
<link rel="stylesheet" href="styles.css" />
</head>
<body>

<header>
  <div class="macro" id="macro">加载中…</div>
  <div class="tabs" id="tabs">
    <button data-view="score" class="on">板块评分</button>
    <button data-view="market">大盘</button>
    <button data-view="flow">主力资金</button>
    <button data-view="swing">回撤 / 涨幅</button>
    <button data-view="events">事件日历</button>
  </div>
  <div class="chips" id="chips"></div>
</header>

<main id="main">
  <!-- 大盘关键位卡片独立成块：它由 levels.json 驱动，放在 #body 之外可避免被其它
       视图的整块重绘冲掉。2026-09-22 起改为「大盘」tab 的内容（与板块评分、
       事件日历并列），所以由 renderCurrent 控制显隐 —— 想让它常驻只需把
       `$('#lvCard').hidden = ...` 那行改成 false。 -->
  <div id="lvCard" hidden></div>
  <div id="body">
    <div class="skel">正在加载评分…</div>
  </div>
</main>

<footer>
  评分仅作研究参考，不构成投资建议 · 数据来源：公开免费接口
</footer>

<!-- 自选管理面板 -->
<div class="sheet" id="sheet" hidden>
  <div class="sheet-head">
    <b>自选板块</b>
    <span id="selcount">0 / 12</span>
    <button id="sheetClose">完成</button>
  </div>
  <input id="search" type="search" placeholder="搜索板块…" autocomplete="off" />
  <div class="sheet-body" id="sheetBody"></div>
</div>
<div class="mask" id="mask" hidden></div>

<script type="module" src="app.js"></script>
</body>
</html>
